name: Atualizar Stats
on:
  schedule:
    - cron: "0 3 * * *" 
  workflow_dispatch:      
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Stats gerais
        uses: anuraghazra/github-readme-stats-action@v2
        with:
          username: victor-hugo-de-alencar-morais
          show_icons: true
          theme: dark
          include_all_commits: true
          output_path: .github/stats/stats.svg

      - name: Linguagens
        uses: anuraghazra/github-readme-stats-action@v2
        with:
          username: victor-hugo-de-alencar-morais
          layout: compact
          langs_count: 16
          theme: dark
          output_path: .github/stats/langs.svg
          api: top-langs

      - name: Commit das imagens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/stats/
          git diff --staged --quiet || git commit -m "Atualiza estatísticas"
          git push
